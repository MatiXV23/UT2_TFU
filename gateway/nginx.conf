# =============================================================================
#  GATEWAY / BALANCEADOR  -  TFU UT2
#
#  Tacticas implementadas en esta capa:
#   * RENDIMIENTO - "Mantener multiples copias de computo":
#       upstream con 3 replicas identicas + politica least_conn + reintento
#       automatico sobre otra replica si una falla (proxy_next_upstream).
#   * SEGURIDAD (resistir ataques) - "Limitar el acceso":
#       - unico punto de entrada del sistema (las replicas y Redis no publican
#         puertos al host y viven en una red Docker interna).
#       - limitacion de tasa por IP (limit_req) y de conexiones (limit_conn).
#       - limite estricto y separado para /auth/login (anti fuerza bruta).
#       - metodos HTTP permitidos y tamano maximo de cuerpo acotados.
#       - cabeceras de servidor ocultas (menor superficie de informacion).
# =============================================================================

worker_processes auto;

events {
    worker_connections 4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/json;

    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout  30;

    # -- "Limitar el acceso": no revelar version ni tecnologia del servidor
    server_tokens off;

    log_format demo '$remote_addr - [$time_local] "$request" '
                    'status=$status upstream=$upstream_addr '
                    'servida_por=$upstream_http_x_served_by '
                    'tiempo=$request_time';
    access_log /var/log/nginx/access.log demo;

    # -- "Limitar el acceso": zonas de limitacion de tasa por IP de origen
    #    trafico general: holgado, para no falsear la prueba de rendimiento
    limit_req_zone  $binary_remote_addr zone=zona_general:10m rate=200r/s;
    #    login: estricto, para frenar fuerza bruta / credential stuffing
    limit_req_zone  $binary_remote_addr zone=zona_login:10m   rate=60r/m;
    limit_conn_zone $binary_remote_addr zone=zona_conex:10m;

    limit_req_status  429;
    limit_conn_status 429;

    # Interfaz grafica de pruebas (subproyecto ./ui). Se publica detras del
    # mismo gateway: asi la UI y la API comparten origen (no hace falta CORS)
    # y se preserva el unico punto de entrada del sistema.
    upstream pool_ui {
        server ui:80;
        keepalive 8;
    }

    # -- "Mantener multiples copias de computo": pool de replicas
    upstream pool_api {
        least_conn;                       # al backend con menos conexiones activas
        server api1:3000 max_fails=2 fail_timeout=5s;
        server api2:3000 max_fails=2 fail_timeout=5s;
        server api3:3000 max_fails=2 fail_timeout=5s;
        keepalive 64;
    }

    server {
        listen 80;
        server_name _;

        # "Limitar el acceso": cuerpo maximo y metodos permitidos
        client_max_body_size 64k;

        add_header X-Gateway "nginx-lb" always;

        # La API responde JSON tambien cuando el limite se aplica en el borde.
        error_page 429 @limite_excedido;
        location @limite_excedido {
            default_type application/json;
            add_header Retry-After 10 always;
            return 429 '{"error":"demasiadas peticiones","origen":"gateway","tactica":"limitar el acceso"}';
        }

        # Solo se aceptan los verbos que la API usa
        if ($request_method !~ ^(GET|POST|HEAD|OPTIONS)$) {
            return 405;
        }

        location = /nginx-health {
            access_log off;
            return 200 '{"estado":"ok","componente":"gateway"}';
        }

        # -- Endpoint de login: limite de tasa mucho mas agresivo
        location = /auth/login {
            limit_req  zone=zona_login burst=20 nodelay;
            limit_conn zona_conex 20;
            proxy_pass http://pool_api;
            include /etc/nginx/proxy_comun.conf;
        }

        # -- Endpoints de la API
        location ~ ^/(api/|whoami|stats|health) {
            limit_req  zone=zona_general burst=400 nodelay;
            limit_conn zona_conex 200;

            proxy_pass http://pool_api;
            include /etc/nginx/proxy_comun.conf;

            # "Mantener multiples copias": si una replica falla o esta caida,
            # la peticion se reintenta transparentemente en otra replica.
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 10s;
        }

        # -- Todo lo demas: la interfaz grafica de pruebas
        location / {
            limit_req  zone=zona_general burst=400 nodelay;
            limit_conn zona_conex 200;
            proxy_pass http://pool_ui;
            include /etc/nginx/proxy_comun.conf;
        }
    }
}
